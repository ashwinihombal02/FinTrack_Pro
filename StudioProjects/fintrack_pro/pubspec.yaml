name: fintrack_pro

description: Offline expense tracker

publish_to: none

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.6

  flutter_riverpod: ^2.5.1

  drift: ^2.18.0

  sqlite3_flutter_libs: ^0.5.24

  path_provider: ^2.1.3

  path: ^1.9.0

  intl: ^0.19.0

  dynamic_color: ^1.8.1

  # 🌍 LOCALIZATION SUPPORT
  flutter_localizations:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^4.0.0

  build_runner: ^2.4.9

  drift_dev: ^2.18.0

flutter:

  uses-material-design: true

  # 🌍 IMPORTANT: enables ARB generation
  generate: true